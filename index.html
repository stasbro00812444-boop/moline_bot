<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --main: #f377c6; --bg: #fdfafd; --text: #2c2c2c; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); background-image: url('https://raw.githubusercontent.com/stasbro00812444-boop/moline_bot/refs/heads/main/LOGO.png'); background-repeat: repeat; background-size: 100px; background-attachment: fixed; margin: 0; padding: 0; color: var(--text); -webkit-tap-highlight-color: transparent; }
        body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(253, 250, 253, 0.94); z-index: -1; }
        .container { padding: 15px; padding-bottom: 140px; }
        .tabs { display: flex; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 99; height: 50px; }
        .tab { flex: 1; display:flex; align-items:center; justify-content:center; font-size: 11px; font-weight: 800; color: #ccc; cursor: pointer; text-transform: uppercase; }
        .tab.active { color: var(--main); border-bottom: 3px solid var(--main); }
        .card { background: rgba(255, 255, 255, 0.92); border-radius: 18px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .row { display: flex; align-items: center; justify-content: space-between; }
        .cat { font-size: 11px; font-weight: 900; color: var(--main); margin: 15px 0 8px 5px; text-transform: uppercase; }
        .btn-send { background: var(--main); color: #fff; border: none; padding: 16px; border-radius: 16px; font-weight: 800; width: 100%; cursor: pointer; font-size: 16px; }
        .btn-m { background: var(--main); color: #fff; border: none; padding: 8px 12px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 12px; }
        .btn-s { border: none; color: var(--main); font-size: 22px; font-weight: 800; background: none; width: 34px; cursor: pointer; }
        .q-input { width: 35px; border: none; background: none; text-align: center; font-weight: 800; font-size: 16px; }
        .del-icon { color: #ff4d4d; font-size: 20px; cursor: pointer; margin-left: 15px; }
        input[type="date"], select { border: 1px solid #eee; padding: 12px; border-radius: 12px; width: 100%; box-sizing: border-box; font-weight: 700; font-size: 16px; outline: none; background: #fff; }
        .banner { background: #fff3f9; border: 2px dashed var(--main); border-radius: 15px; padding: 12px; margin-bottom: 15px; text-align: center; }
        .footer { position: fixed; bottom: 0; width: 100%; background: rgba(255, 255, 255, 0.96); padding: 15px 20px 30px; border-top: 1px solid #eee; box-sizing: border-box; z-index: 100; }
        .hidden { display: none !important; }
        .partner-row { padding: 14px; border-bottom: 1px solid #eee; cursor: pointer; font-weight: 700; color: var(--main); }
        .partner-row:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="tabs" id="tabs">
        <div id="t-order" class="tab active" onclick="switchTab('order')">ЗАКАЗ</div>
        <div id="t-admin" class="tab hidden" onclick="switchTab('admin')">АДМИН ⚡</div>
    </div>

    <div id="p-order" class="container">
        <div id="edit-banner" class="banner hidden">
            <div id="edit-title" style="font-weight: 900; color: var(--main); font-size: 12px;"></div>
            <button class="btn-m" style="margin-top:8px; background:#fff; color:#ff4d4d; border:1px solid #ff4d4d" onclick="cancelEdit()">ОТМЕНИТЬ И ВЫЙТИ</button>
        </div>

        <div class="card">
            <div style="font-size: 10px; font-weight: 800; color: #999; margin-bottom: 5px;">ДАТА ДОСТАВКИ</div>
            <input type="date" id="order-date" onchange="renderMenu()">
        </div>
        
        <div id="shop-selector-box" class="card hidden">
            <div style="font-size: 10px; font-weight: 800; color: #999; margin-bottom: 5px;">КОФЕЙНЯ</div>
            <select id="shop-select" onchange="renderMenu()"></select>
        </div>

        <div id="menu-content"></div>
    </div>

    <div id="p-admin" class="container hidden">
        <button class="btn-send" style="margin-bottom:15px;" onclick="showPartnerPicker()">+ СОЗДАТЬ НОВЫЙ ЗАКАЗ</button>
        
        <div id="partner-picker" class="card hidden" style="border: 2px solid var(--main); padding: 0;">
            <div style="font-size: 10px; font-weight: 800; color: #999; padding: 15px 15px 5px;">ВЫБЕРИТЕ КОФЕЙНЮ</div>
            <div id="partner-list" style="max-height: 300px; overflow-y: auto;"></div>
            <div style="padding: 10px 15px 15px;">
                <button class="btn-send" style="background:#eee; color:#777; padding:10px;" onclick="hidePartnerPicker()">ЗАКРЫТЬ</button>
            </div>
        </div>

        <div class="card">
            <div style="font-size: 10px; font-weight: 800; color: #999; margin-bottom: 5px;">ПРОСМОТР ЗАКАЗОВ НА ДАТУ</div>
            <input type="date" id="admin-date" onchange="refreshAdmin()">
        </div>
        <div id="admin-orders"></div>
    </div>

    <div id="footer" class="footer hidden">
        <div class="row">
            <div><span id="deliv-info" style="font-size:10px; color:var(--main); font-weight:800">Доставка: 0 ₽</span><br><b id="total-price" style="font-size:22px">0 ₽</b></div>
            <button id="btn-submit" class="btn-send" style="width: auto; padding: 16px 35px;" onclick="submit()">ОФОРМИТЬ</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    const API = 'https://script.google.com/macros/s/AKfycbxkjRjEpQid-f05-C6K7XhoxtMu7HQ3CiSHiLesiHfDrBORiDV24YYdts644qCJ0xT5/exec';
    const user = (tg.initDataUnsafe?.user?.username || "id_" + tg.initDataUnsafe?.user?.id).toLowerCase().replace('@', '');

    let state = { isAdmin: false, menu: [], activePartners: [], currentOrder: {}, editingUser: user, editingShop: "", isEditMode: false };

    async function init() {
        tg.expand();
        const res = await fetch(`${API}?type=menu&user=${user}`).then(r => r.json());
        state.isAdmin = res.isAdmin;
        state.menu = res.menu;
        state.activePartners = res.activePartners || [];
        
        document.getElementById('order-date').value = new Date().toISOString().split('T')[0];
        
        if (state.isAdmin) {
            // Если админ — убираем вкладку Заказ из навигации
            document.getElementById('t-order').classList.add('hidden');
            document.getElementById('t-admin').classList.remove('hidden');
            document.getElementById('admin-date').value = document.getElementById('order-date').value;
            switchTab('admin');
        } else {
            const sel = document.getElementById('shop-select');
            res.displayNames.forEach(n => sel.innerHTML += `<option value="${n}">${n}</option>`);
            if (res.displayNames.length > 1) document.getElementById('shop-selector-box').classList.remove('hidden');
            state.editingShop = res.displayNames[0];
            switchTab('order');
        }
    }

    function switchTab(t) {
        document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
        document.querySelectorAll('.tab').forEach(tb => tb.classList.remove('active'));
        document.getElementById('p-' + t).classList.remove('hidden');
        document.getElementById('t-' + t).classList.add('active');
        document.getElementById('footer').classList.toggle('hidden', t !== 'order');
        if (t === 'admin') refreshAdmin(); else renderMenu();
    }

    function renderMenu() {
        const box = document.getElementById('menu-content'); box.innerHTML = '';
        let groups = {};
        state.menu.forEach(i => { groups[i.cat] = groups[i.cat] || []; groups[i.cat].push(i); });
        for (let c in groups) {
            box.innerHTML += `<div class="cat">${c}</div>`;
            groups[c].forEach(i => {
                const q = state.currentOrder[i.name]?.qty || 0;
                box.innerHTML += `<div class="card row">
                    <div><b>${i.name}</b><br><small>${i.price} ₽</small></div>
                    <div style="display:flex; align-items:center; background:#fff; border-radius:12px; border:1px solid #eee;">
                        <button class="btn-s" onclick="upd('${i.name}',${i.price},-1)">-</button>
                        <input class="q-input" value="${q}" readonly>
                        <button class="btn-s" onclick="upd('${i.name}',${i.price},1)">+</button>
                    </div>
                </div>`;
            });
        }
        calc();
    }

    function upd(n, p, d) {
        state.currentOrder[n] = state.currentOrder[n] || {qty:0, price:p};
        state.currentOrder[n].qty += d;
        if(state.currentOrder[n].qty <= 0) delete state.currentOrder[n];
        renderMenu();
        tg.HapticFeedback.impactOccurred('light');
    }

    function calc() {
        let sub = 0; for(let k in state.currentOrder) sub += state.currentOrder[k].qty * state.currentOrder[k].price;
        let del = (sub > 0 && sub < 3000) ? 300 : 0;
        document.getElementById('deliv-info').innerText = `Доставка: ${del} ₽`;
        document.getElementById('total-price').innerText = (sub + del) + " ₽";
        document.getElementById('btn-submit').innerText = "СОХРАНИТЬ";
    }

    async function refreshAdmin() {
        const date = document.getElementById('admin-date').value;
        const list = document.getElementById('admin-orders');
        list.innerHTML = '<center style="padding:20px; font-size:12px; color:#999;">Обновление данных...</center>';
        try {
            const data = await fetch(`${API}?type=admin_all&date=${date}&user=${user}`).then(r => r.json());
            list.innerHTML = '';
            if(!data.length) { list.innerHTML = '<div class="card" style="text-align:center; color:#999;">Заказов на эту дату нет</div>'; return; }
            data.forEach(ord => {
                list.innerHTML += `<div class="card row">
                    <div style="flex:1"><b>${ord.shopName}</b><br><small>${ord.total} ₽ (ID: ${ord.user})</small></div>
                    <div style="display:flex; align-items:center;">
                        <button class="btn-m" onclick="startEdit('${ord.user}', '${ord.shopName}', ${JSON.stringify(ord.items).replace(/"/g, '&quot;')})">ПРАВИТЬ</button>
                        <span class="del-icon" onclick="deleteOrd('${ord.user}','${ord.shopName}')">✖</span>
                    </div>
                </div>`;
            });
        } catch(e) { list.innerHTML = '<div class="card">Ошибка загрузки</div>'; }
    }

    function startEdit(uid, shop, items) {
        state.isEditMode = true; state.editingUser = uid; state.editingShop = shop; state.currentOrder = {};
        items.forEach(it => { state.currentOrder[it.name] = {qty: it.qty, price: it.price}; });
        document.getElementById('edit-title').innerText = "ПРАВКА: " + shop;
        document.getElementById('edit-banner').classList.remove('hidden');
        document.getElementById('order-date').value = document.getElementById('admin-date').value;
        switchTab('order');
    }

    function cancelEdit() {
        state.isEditMode = false; state.currentOrder = {}; state.editingUser = user;
        document.getElementById('edit-banner').classList.add('hidden');
        switchTab('admin');
    }

    function showPartnerPicker() {
        const list = document.getElementById('partner-list'); 
        list.innerHTML = '';
        if (state.activePartners.length === 0) {
            list.innerHTML = '<div style="padding:20px; text-align:center; font-size:12px;">Партнеры не найдены</div>';
        }
        state.activePartners.forEach(p => {
            const div = document.createElement('div'); 
            div.className = 'partner-row'; 
            div.innerText = p.name;
            div.onclick = () => {
                state.isEditMode = true; 
                state.editingUser = p.uid; 
                state.editingShop = p.name; 
                state.currentOrder = {};
                document.getElementById('edit-title').innerText = "НОВЫЙ ЗАКАЗ: " + p.name;
                document.getElementById('edit-banner').classList.remove('hidden');
                hidePartnerPicker(); 
                switchTab('order');
            };
            list.appendChild(div);
        });
        document.getElementById('partner-picker').classList.remove('hidden');
    }

    async function submit() {
        const date = document.getElementById('order-date').value;
        const shop = state.editingShop;
        if (!Object.keys(state.currentOrder).length) return alert("Заказ пуст!");
        tg.MainButton.showProgress();
        try {
            await fetch(API, {method:'POST', body: JSON.stringify({user: state.editingUser, date: date, items: state.currentOrder, shopName: shop})});
            state.isEditMode = false; 
            state.currentOrder = {};
            document.getElementById('edit-banner').classList.add('hidden');
            switchTab('admin');
        } catch(e) { alert("Ошибка сохранения!"); }
        tg.MainButton.hideProgress();
    }

    async function deleteOrd(u, s) {
        if(!confirm("Удалить этот заказ?")) return;
        tg.MainButton.showProgress();
        await fetch(API, {method:'POST', body: JSON.stringify({deleteOrder:true, user:u, date:document.getElementById('admin-date').value, shopName:s})});
        tg.MainButton.hideProgress();
        refreshAdmin();
    }

    function hidePartnerPicker() { document.getElementById('partner-picker').classList.add('hidden'); }
    init();
</script>
</body>
</html>
